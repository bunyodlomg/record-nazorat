# Record Nazorat — Nginx server block
# Joylashuv: /etc/nginx/sites-available/recordspeaking.uz
# Faollashtirish: ln -s /etc/nginx/sites-available/recordspeaking.uz /etc/nginx/sites-enabled/
#
# SSL bo'limini Certbot avtomatik to'ldiradi:
#   sudo certbot --nginx -d recordspeaking.uz -d www.recordspeaking.uz

# HTTP → HTTPS redirect (certbot keyin avtomatik qo'shadi, lekin shu yerda ham bor)
server {
    listen 80;
    listen [::]:80;
    server_name recordspeaking.uz www.recordspeaking.uz;

    # Let's Encrypt verification uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recordspeaking.uz www.recordspeaking.uz;

    # SSL — certbot bu qatorlarni avtomatik to'ldiradi
    # ssl_certificate     /etc/letsencrypt/live/recordspeaking.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/recordspeaking.uz/privkey.pem;

    # Xavfsizlik header'lari
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload limit (rasm/feedback uchun)
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ── Frontend (Vite build natijasi) ─────────────────────────────
    root /var/www/recordnazorat/client/dist;
    index index.html;

    # Static assetlar — uzoq cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — react-router yo'q, lekin har holda
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API → Node (Express, port 5000) ─────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 90s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }
}
